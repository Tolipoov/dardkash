# /etc/nginx/sites-available/dardkash.uz
#
# MUHIM: bu fayl faqat dardkash.uz va www.dardkash.uz domenlariga tegishli.
# Serverdagi boshqa saytlarning konfiguratsiya fayllariga (masalan
# /etc/nginx/sites-available/boshqa-loyiha.conf) HECH QANDAY o'zgartirish
# kiritilmaydi va kiritish shart emas.
#
# O'rnatish:
#   sudo cp dardkash.uz.conf /etc/nginx/sites-available/dardkash.uz
#   sudo ln -s /etc/nginx/sites-available/dardkash.uz /etc/nginx/sites-enabled/dardkash.uz
#   sudo nginx -t   # albatta sinab ko'ring
#   sudo systemctl reload nginx   # restart EMAS, reload — boshqa saytlar uzilmaydi

# --- 1-bosqich: Certbot sertifikat olguncha (faqat HTTP) ---
server {
    server_name dardkash.uz www.dardkash.uz;

    # www -> asosiy domen (bitta sahifa ikki manzilda ochilmasin)
    if ($host = www.dardkash.uz) {
        return 301 https://dardkash.uz$request_uri;
    }

    # Xavfsizlik sarlavhalari (faqat shu sayt uchun)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

    # Certbot webroot orqali tekshiruv (agar --nginx pluginidan foydalanmasangiz)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/dardkash.uz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dardkash.uz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

