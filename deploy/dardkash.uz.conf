server {
    if ($host = www.dardkash.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = dardkash.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name dardkash.uz www.dardkash.uz;
    return 404; # managed by Certbot




