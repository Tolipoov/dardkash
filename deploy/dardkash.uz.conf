# /etc/nginx/sites-available/dardkash.uz
#
# MUHIM: bu fayl faqat dardkash.uz va www.dardkash.uz domenlariga tegishli.
# Serverdagi boshqa saytlarning konfiguratsiya fayllariga (masalan
# /etc/nginx/sites-available/boshqa-loyiha.conf) HECH QANDAY o'zgartirish
# kiritilmaydi va kiritish shart emas.
#
# O'rnatish:
#   sudo cp dardkash.uz.conf /etc/nginx/sites-available/dardkash.uz
#   sudo ln -s /etc/nginx/sites-available/dardkash.uz /etc/nginx/sites-enabled/dardkash.uz
#   sudo nginx -t   # albatta sinab ko'ring
#   sudo systemctl reload nginx   # restart EMAS, reload — boshqa saytlar uzilmaydi

# --- 1-bosqich: Certbot sertifikat olguncha (faqat HTTP) ---
server {
    listen 80;
    listen [::]:80;
    server_name dardkash.uz www.dardkash.uz;

    # Certbot webroot orqali tekshiruv (agar --nginx pluginidan foydalanmasangiz)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Backend (Express, dardkash-api konteyneri, port 4000) — frontend
    # barcha /api/... so'rovlarini nisbiy yo'l bilan yuboradi, shuning uchun
    # bu blok location / dan OLDIN turishi shart (Google/Telegram OAuth
    # callback, /api/me, /api/profile, /api/session/*/token shu orqali ishlaydi).
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        # /api/ws/chat va /api/ws/notify shu prefiks ostida ishlaydi —
        # Upgrade/Connection sarlavhalari bo'lmasa, WebSocket ulanishi
        # nginx darajasida oddiy HTTP so'rovga aylanib, 101 emas 200/400
        # bilan yiqiladi (yozishma va real-vaqt bildirishnomalar
        # productionda ishlamay qolgan edi). proxy_read_timeout ham
        # standart 60s'dan uzunroq qilingan — aks holda ochiq turgan,
        # lekin xabar kelmayotgan socket 1 daqiqadan keyin nginx
        # tomonidan yopib yuborilardi.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

